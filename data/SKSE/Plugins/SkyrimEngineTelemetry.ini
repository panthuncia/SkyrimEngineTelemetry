[Threads]
; Give unnamed threads a description (RTTI class of their start object, or
; module+offset of their start routine). Tracy picks these names up.
bNameThreads=1
; Log the thread table to the SKSE log at kDataLoaded.
bLogThreads=1

[Sampler]
; Sample every busy thread's call stack to find work outside SET_ZONE scopes.
; Development tool: off by default. Reports are written to
; Documents/My Games/Skyrim Special Edition/SKSE/SkyrimEngineTelemetry/.
bEnable=0
; Microseconds between sampling rounds. Each round samples every thread that
; used CPU since its last sample, so each thread is sampled at most at 1/interval.
iIntervalUs=1000
; Seconds between report rewrites. Each report is cumulative for the session.
iReportIntervalSec=30

[BasicTelemetry]
; Retain SET_ZONE timings and write queryable artifacts. The runner enables this
; and gives every launch its own output directory.
bCapture=0
; Summary retains aggregate distributions; Trace additionally retains individual
; scope events and their parent/frame relationships.
sMode=Summary
sOutputDirectory=
iSnapshotIntervalSec=10
iMaximumTraceEvents=1000000
bWriteSqlite=1
bWriteMarkdown=1
; Per-scope GetThreadTimes calls are useful for scheduler analysis but expensive.
bMeasureThreadCpuTime=0
